name: slash-command-builder
version: 1.0.2
description: >-
  Builds a user-invoked command — a saved prompt the user calls by name, with
  arguments, gathered context and file references — and diagnoses one that
  does not appear or substitutes the wrong argument. Covers choosing a command
  over a skill, the argument forms and their off-by-one, and testing before
  hand-back. Use when the user asks "create a slash command", "make me a
  /command", "turn this prompt into a command", "how do I pass arguments to a
  command", "why does my command get the wrong argument", "why is my command
  not listed", "should this be a command or a skill", "review my command
  file". Also triggers on « crée-moi une commande », « pourquoi ma commande ne
  s'affiche pas », « commande ou skill ».
author: Frederick SALES
license: proprietary
type: skill

dependencies:
  apm: []
  mcp: []
