name: agent-builder
version: 1.0.2
description: >-
  Builds a delegated agent — a subagent that runs in its own context — and
  diagnoses one that is never picked or acts outside its remit: choosing an
  agent over a skill, the description that drives discovery, a self-contained
  system prompt, least-privilege capabilities, and a discovery test before
  hand-back. Platform-independent — the transport places the file. Use when
  the user asks "create an agent", "make me a subagent", "write a custom
  agent", "delegate this to an agent", "why is my agent never used", "why does
  Claude pick the wrong agent", "how do I restrict what an agent can do",
  "should this be an agent or a skill", "review my agent definition". Also
  triggers on « crée-moi un agent », « pourquoi mon agent n'est jamais appelé
  », « agent ou skill ».
author: Frederick SALES
license: proprietary
type: skill

dependencies:
  apm: []
  mcp: []
